# hyprpaper (still hyprlang syntax, not Lua) - https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
# ctOS wallpapers from ~/ctOS/extras/wallpapers:
#   ctos-v1.png  centred tesseract logo
#   ctos-v2.png  small logo bottom-left (less busy behind windows)

# empty monitor = fallback for every output
wallpaper {
    monitor =
    path = ~/.config/hypr/wallpapers/ctos-v1.png
    fit_mode = cover
}

splash = false
