# hyprlock - ctOS lock screen (hyprlang syntax, not Lua)
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# RECOVERY if the lock screen hangs or crashes (session lives on tty3):
#   1. Ctrl+Alt+F4, log in on the console
#   2. hung:    pkill -USR1 hyprlock          (hyprlock unlocks on SIGUSR1)
#      crashed: hyprctl --instance 0 dispatch 'hl.dsp.exec_cmd("hyprlock")'
#               (needs misc.allow_session_lock_restore = true in hyprland.lua)
#      last resort, loses the session: hyprctl --instance 0 dispatch 'hl.dsp.exit()'
#   3. Ctrl+Alt+F3 to go back

# palette from ~/ctOS/common/Theme.qml
$bg        = rgb(0e0e0e)
$ctos      = rgb(d9d9d9)
$text      = rgb(ffffff)
$secondary = rgb(7a7a7a)
$accent    = rgb(1bfd9c)
$error     = rgb(fc3e38)
$font      = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/ctos-v2.png
    color = $bg
}

# ── CT|OS mark, top-left (same as the Waybar label) ─────────
shape {
    monitor =
    size = 84, 44
    color = $ctos
    rounding = 0
    border_size = 0
    position = 40, -40
    halign = left
    valign = top
    zindex = 0
}
label {
    monitor =
    text =  CT
    color = $bg
    font_size = 22
    font_family = $font
    position = 44, -44
    halign = left
    valign = top
    zindex = 1
}
label {
    monitor =
    text = OS
    color = $ctos
    font_size = 28
    font_family = JetBrainsMono Nerd Font Light
    position = 130, -38
    halign = left
    valign = top
}

# ── status, top-right ───────────────────────────────────────
label {
    monitor =
    text = cmd[update:0] echo "SESSION LOCKED // $(hostname | tr '[:lower:]' '[:upper:]')"
    color = $secondary
    font_size = 11
    font_family = $font
    position = -40, -52
    halign = right
    valign = top
}

# ── clock / date / user, centre ─────────────────────────────
label {
    monitor =
    text = $TIME
    color = $ctos
    font_size = 96
    font_family = JetBrainsMono Nerd Font Light
    position = 0, 170
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%Y-%m-%d  //  %A" | tr '[:lower:]' '[:upper:]'
    color = $secondary
    font_size = 13
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] echo "▨ $(id -un | tr '[:lower:]' '[:upper:]')"
    color = $text
    font_size = 13
    font_family = $font
    position = 0, 10
    halign = center
    valign = center
}

# ── password ────────────────────────────────────────────────
input-field {
    monitor =
    size = 360, 46
    outline_thickness = 1
    rounding = 0

    outer_color = $ctos
    inner_color = $bg
    font_color  = $text
    check_color = $accent
    fail_color  = $error
    capslock_color = $error

    font_family = $font
    placeholder_text = <span foreground="##7a7a7a">PASSPHRASE &lt;&gt; ...</span>
    fail_text = ACCESS DENIED ($ATTEMPTS)
    check_text = VERIFYING...
    fade_on_empty = false

    dots_size = 0.25
    dots_spacing = 0.4
    dots_rounding = 0

    position = 0, -60
    halign = center
    valign = center
}
