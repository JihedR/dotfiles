# pipewire-jack client rules - https://docs.pipewire.org/page_man_pipewire-jack_conf_5.html
# REAPER always gets 256/48000, however it is launched. Same props PIPEWIRE_QUANTUM=256/48000 sets
# (pipewire-jack.c: node.force-rate = rate, node.force-quantum = buffer size).

jack.rules = [
    {
        matches = [
            { application.process.binary = "reaper" }    # /usr/bin/reaper and /usr/lib/REAPER/reaper alike
        ]
        actions = {
            update-props = {
                node.force-quantum = 256
                node.force-rate    = 48000
            }
        }
    }
]
