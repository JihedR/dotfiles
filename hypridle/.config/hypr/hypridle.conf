# hypridle (hyprlang syntax, not Lua) - https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# dbus idle inhibitors (video players, calls) are respected: ignore_dbus_inhibit defaults to false

general {
    lock_cmd         = pidof hyprlock || hyprlock                      # one instance only
    before_sleep_cmd = loginctl lock-session                           # always lock before suspend
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screen on after resume
}

# lock after 10 min
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# screen off 1 min after locking
listener {
    timeout    = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
